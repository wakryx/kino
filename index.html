<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Кино вдвоём</title>
  <meta name="description" content="Смотрим фильмы вместе: синхронный просмотр, передача файла и трансляция без серверов.">
  <meta name="theme-color" content="#14120f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238a6440'/%3E%3Cpath d='M24 18l24 14-24 14z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span> Кино вдвоём</div>
    <div class="top-status" id="topStatus" hidden>
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Подключаюсь…</span>
      <span class="chip" id="netChip" hidden></span>
    </div>
    <button class="btn ghost small" id="leaveBtn" hidden>Выйти</button>
  </header>

  <!-- ЛОББИ -->
  <main id="lobby" class="lobby">
    <div class="card lobby-card">
      <h1>Смотрим фильм вместе</h1>

      <label class="field">
        <span>Как тебя зовут</span>
        <input id="nameInput" maxlength="24" placeholder="Например, Катенок" autocomplete="nickname">
      </label>

      <button class="btn primary big" id="createBtn">Создать комнату</button>

      <div class="divider"><span>или войти по коду</span></div>

      <form class="join-row" id="joinForm">
        <input id="codeInput" placeholder="Код комнаты или ссылка" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn" type="submit">Войти</button>
      </form>
      <p class="error" id="lobbyError" hidden></p>

      <details class="settings">
        <summary>Настройки соединения</summary>
        <label class="field"><span>TURN адрес(а), через запятую</span>
          <input id="turnUrl" placeholder="turn:example.com:3478, turns:example.com:443?transport=tcp"></label>
        <div class="two">
          <label class="field"><span>Логин</span><input id="turnUser" autocomplete="off"></label>
          <label class="field"><span>Пароль</span><input id="turnPass" type="password" autocomplete="off"></label>
        </div>
        <label class="field"><span>Свой PeerJS-сервер (необязательно)</span>
          <input id="peerServer" placeholder="my-peer-server.onrender.com"></label>
        <button class="btn small" id="saveSettings">Сохранить</button>
        <span class="muted small" id="settingsSaved" hidden>Сохранено</span>
      </details>
    </div>
  </main>

  <!-- КОМНАТА -->
  <main id="room" class="room" hidden>
    <div class="main-col">
      <div class="tabs" role="tablist">
        <button role="tab" data-mode="sync" aria-selected="true"><b>Синхронно</b></button>
        <button role="tab" data-mode="send" aria-selected="false"><b>Передать файл</b></button>
        <button role="tab" data-mode="stream" aria-selected="false"><b>Трансляция</b></button>
      </div>

      <div class="stage" id="stage">
        <video id="player" playsinline preload="auto"></video>
        <div class="stage-empty" id="stageEmpty"><div><p id="stageEmptyText"></p></div></div>
        <button class="stage-overlay" id="playOverlay" hidden>Продолжить просмотр</button>
        <video id="faceVideo" class="face" playsinline autoplay hidden></video>
        <div class="viewer-bar" id="viewerBar" hidden>
          <button class="vb" id="vToggle" title="Пауза / воспроизведение"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
          <button class="vb" id="vBack" title="Назад 10 секунд">−10</button>
          <button class="vb" id="vFwd" title="Вперёд 10 секунд">+10</button>
          <span class="vtime" id="vTime">0:00</span>
          <input type="range" id="vSeek" min="0" max="1000" value="0" aria-label="Перемотка">
          <span class="vtime" id="vDur">0:00</span>
          <input type="range" id="vVol" min="0" max="1" step="0.01" value="1" aria-label="Громкость" class="vol">
        </div>
        <div class="stats" id="stats" hidden></div>
        <button class="fs-btn" id="fsBtn" title="Во весь экран"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
        <div class="toasts" id="toasts" aria-live="polite"></div>
      </div>

      <!-- Режим 1 -->
      <section class="panel" data-panel="sync">
        <div class="row">
          <label class="btn file-btn">Выбрать файл<input type="file" id="syncFile" accept="video/*,.mkv,.mp4,.webm,.mov,.m4v"></label>
          <label class="btn file-btn ghost">Субтитры<input type="file" id="subsFile" accept=".srt,.vtt,text/vtt"></label>
        </div>
        <form class="row url-row" id="urlForm">
          <input id="urlInput" placeholder="Ссылка на видео" inputmode="url">
          <button class="btn" type="submit">Открыть</button>
        </form>
        <div class="offer" id="urlOffer" hidden></div>
        <div class="media-info">
          <div><span class="muted">У тебя:</span> <span id="myMedia">ничего не выбрано</span></div>
          <div><span class="muted" id="partnerMediaLabel">У партнёра:</span> <span id="partnerMedia">ничего не выбрано</span></div>
          <div id="matchInfo" class="small"></div>
        </div>
      </section>

      <!-- Режим 2 -->
      <section class="panel" data-panel="send" hidden>
        <div class="row">
          <label class="btn primary file-btn">Выбрать файл и отправить<input type="file" id="sendFile" accept="video/*,.mkv,.mp4,.webm,.mov,.m4v"></label>
          <button class="btn ghost" id="cancelTransfer" hidden>Отменить</button>
        </div>
        <div class="transfer" id="transfer" hidden>
          <div class="transfer-head"><b id="trTitle"></b><span id="trName" class="muted"></span></div>
          <div class="bar"><div id="trBar"></div></div>
          <div class="muted small" id="trInfo"></div>
        </div>
        <a class="btn" id="saveReceived" hidden download>Сохранить на компьютер</a>
      </section>

      <!-- Режим 3 -->
      <section class="panel" data-panel="stream" hidden>
        <div class="row">
          <label class="btn primary file-btn">Выбрать файл и транслировать<input type="file" id="streamFile" accept="video/*,.mkv,.mp4,.webm,.mov,.m4v"></label>
          <button class="btn" id="streamCurrent" hidden>Транслировать открытый фильм</button>
          <button class="btn ghost" id="stopStream" hidden>Остановить</button>
        </div>
        <div class="row">
          <label class="field inline"><span>Качество</span>
            <select id="qBitrate">
              <option value="4000000">Экономно · 4 Мбит/с</option>
              <option value="8000000">Хорошо · 8 Мбит/с</option>
              <option value="15000000" selected>Отлично · 15 Мбит/с</option>
              <option value="25000000">Максимум · 25 Мбит/с</option>
              <option value="40000000">Без ограничений · 40 Мбит/с</option>
            </select></label>
          <label class="field inline"><span>Кадры</span>
            <select id="qFps"><option value="30">до 30 fps</option><option value="60" selected>до 60 fps</option></select></label>
          <label class="field inline"><span>Буфер у зрителя</span>
            <select id="qBuffer">
              <option value="150">минимум задержки</option>
              <option value="500" selected>0.5 c (плавнее)</option>
              <option value="1500">1.5 c (самый плавный)</option>
            </select></label>
        </div>
      </section>
    </div>

    <aside class="side">
      <div class="card invite" id="invite">
        <b>Приглашение</b>
        <div class="code" id="roomCode"></div>
        <div class="join-row">
          <input id="inviteLink" readonly>
          <button class="btn" id="copyLink">Копировать</button>
        </div>
      </div>

      <div class="card call">
        <b>Звонок</b>
        <div class="row">
          <button class="btn toggle" id="micBtn" aria-pressed="false">Микрофон</button>
          <button class="btn toggle" id="camBtn" aria-pressed="false">Камера</button>
        </div>
        <label class="field inline"><span>Громкость собеседника</span>
          <input type="range" id="voiceVol" min="0" max="1" step="0.01" value="1"></label>
      </div>

      <div class="card chat">
        <b>Чат</b>
        <ul class="messages" id="messages"></ul>
        <form class="join-row" id="chatForm">
          <input id="chatInput" placeholder="Сообщение…" autocomplete="off" maxlength="500">
          <button class="btn" type="submit" >Отправить</button>
        </form>
      </div>
    </aside>
  </main>

  <script src="vendor/peerjs.min.js"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
